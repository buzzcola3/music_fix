services:
  beets-tagger:
    build: .
    image: music-fix-beets:latest
    container_name: beets-tagger
    environment:
      - PUID=1000
      - PGID=1000
      - GENIUS_API_KEY=${GENIUS_API_KEY:-}
      - MUSIXMATCH_API_KEY=${MUSIXMATCH_API_KEY:-}
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY:-}
    volumes:
      - ./config:/config
      - /home/buzz/services/music_dl/downloads/82f8b3e5-5536-4c5c-8b90-bc1713807e6e:/music
      - ./output/fixed:/fixed
      - ./output/failed:/failed
      - ./output/all:/all
      - ./process.sh:/process.sh:ro
    entrypoint: ["/bin/bash", "/process.sh"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "command -v beet >/dev/null && command -v fpcalc >/dev/null && command -v ffmpeg >/dev/null && python3 -c 'import acoustid' && test -n \"$${ACOUSTID_API_KEY}\" && beet version | grep -q chroma && beet version | grep -q musicbrainz"
        ]
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 30s
    env_file:
      - .env          # optional — loads from .env file if present

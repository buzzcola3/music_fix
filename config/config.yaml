directory: /fixed
library: /config/library.db

import:
  move: yes
  copy: no
  write: yes
  log: /config/import.log
  timid: no
  quiet: yes
  autotag: yes
  incremental: yes
  incremental_skip_later: yes
  from_scratch: yes

match:
  # Be slightly more tolerant for YouTube/downloaded audio, which can include
  # video edits, intros, outros, silence, or different mastering than the
  # MusicBrainz release track.
  strong_rec_thresh: 0.20
  medium_rec_thresh: 0.45

plugins:
  # Prefer actual-audio fingerprint matching before filename/metadata heuristics.
  - chroma
  # Keep filename parsing available as a fallback for files AcoustID cannot identify.
  - fromfilename
  - lyrics
  - fetchart
  - lastgenre
  - mbsync
  - duplicates

chroma:
  auto: yes

acoustid:
  apikey: ${ACOUSTID_API_KEY}

musicbrainz:
  extra_tags: [year, catalognum, country, media, label]

lyrics:
  auto: yes
  sources: [genius, azlyrics]
  genius_api_key: ${GENIUS_API_KEY}
  musixmatch_api_key: ${MUSIXMATCH_API_KEY}
  fallback: ""
  force: no

fetchart:
  auto: yes
  minwidth: 300
  maxwidth: 1200
  quality: 80
  sources: [itunes, coverart, amazon, albumart]

lastgenre:
  auto: yes
  count: 1
  prefer_specific: yes
  canonical: yes
  source: album

paths:
  default: $albumartist/$album%if{$year, ($year)}/$track - $title
  singleton: Non-Album/$artist - $title
  comp: Compilations/$album%if{$year, ($year)}/$track - $title

ui:
  color: no         # no ANSI colors in log output
